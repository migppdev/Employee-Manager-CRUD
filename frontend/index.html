<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestor de empleados</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <h1>PANEL DE GESTIÓN - RRHH</h1>
      <nav>
        <button class="btn" id="crear-empleado-btn">Crear empleado</button>
        <button class="btn" id="nominas-btn">Generar nóminas</button>
      </nav>
    </header>
    <main>
      <table id="tabla-empleados">
        <caption>
          <h2>Lista de empleados</h2>
        </caption>
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Primer apellido</th>
            <th>Segundo apellido</th>
            <th>Puesto</th>
            <th>Fecha de incorporación</th>
            <th>Salario base</th>
            <th>Antiguedad</th>
            <th>Salario calculado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="cuerpo-tabla-empleados"></tbody>
      </table>
    </main>

    <script type="module" src="./js/api.js"></script>
  </body>
</html>
