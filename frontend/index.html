<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestor de empleados</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <h1>PANEL DE GESTIÓN - RRHH</h1>
      <nav>
        <button class="btn" id="abrir-modal-crear-empleado">
          Crear empleado
        </button>
        <button class="btn" id="nominas-btn">Generar nóminas</button>
      </nav>
    </header>
    <main>
      <table id="tabla-empleados">
        <caption>
          <h2>Lista de empleados</h2>
        </caption>
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Primer apellido</th>
            <th>Segundo apellido</th>
            <th>DNI</th>
            <th>Puesto</th>
            <th>Fecha de incorporación</th>
            <th>Salario base</th>
            <th>Antiguedad</th>
            <th>Salario calculado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="cuerpo-tabla-empleados"></tbody>
      </table>
      <!-- ============ CREAR EMPLEADO  ============ -->

      <div id="modal-crear-empleado" class="modal">
        <div class="modal-contenido">
          <h1>Crear empleado</h1>
          <form class="form">
            <div class="fila-form">
              <label for="nombre">Nombre</label>
              <input type="text" id="nombre" required />
            </div>
            <div class="fila-form">
              <label for="apellido-1">Primer apellido</label>
              <input type="text" id="apellido-1" required />
            </div>
            <div class="fila-form">
              <label for="apellido-2">Segundo apellido</label>
              <input type="text" id="apellido-2" />
            </div>
            <div class="fila-form">
              <label for="dni">DNI</label>
              <input type="text" id="dni" />
            </div>
            <div class="fila-form">
              <label for="puesto">Puesto</label>
              <input type="text" id="puesto" />
            </div>
            <div class="fila-form">
              <label for="fecha-incorporacion">Fecha de incorporación</label>
              <input type="date" id="fecha-incorporacion" />
            </div>
            <div class="fila-form">
              <label for="salario-base">Salario base</label>
              <input type="number" id="salario-base" />
            </div>
            <div class="fila-botones">
              <button type="button" class="btn" id="crear-empleado-btn">
                Crear
              </button>
              <button type="button" class="btn cerrar-modal-btn">
                Cancelar
              </button>
            </div>
          </form>
        </div>
      </div>

      <div id="modal-editar-empleado" class="modal">
        <div class="modal-contenido">
          <h1>Editar empleado</h1>
          <form class="form">
            <input type="hidden" id="id-editar" disabled />
            <div class="fila-form">
              <label for="nombre">Nombre</label>
              <input type="text" id="nombre-editar" required />
            </div>
            <div class="fila-form">
              <label for="apellido-1-editar">Primer apellido</label>
              <input type="text" id="apellido-1-editar" required />
            </div>
            <div class="fila-form">
              <label for="apellido-2-editar">Segundo apellido</label>
              <input type="text" id="apellido-2-editar" />
            </div>
            <div class="fila-form">
              <label for="dni">DNI</label>
              <input type="text" id="dni-editar" />
            </div>
            <div class="fila-form">
              <label for="puesto">Puesto</label>
              <input type="text" id="puesto-editar" />
            </div>
            <div class="fila-form">
              <label for="fecha-incorporacion">Fecha de incorporación</label>
              <input type="date" id="fecha-incorporacion-editar" />
            </div>
            <div class="fila-form">
              <label for="salario-base">Salario base</label>
              <input type="number" id="salario-base-editar" />
            </div>
            <div class="fila-botones">
              <button
                type="button"
                class="btn cerrar-modal-btn"
                id="editar-empleado-btn"
              >
                Confirmar cambios
              </button>
              <button type="button" class="btn" id="cerrar-modal-editar-btn">
                Cancelar
              </button>
            </div>
          </form>
        </div>
      </div>

      <div class="notificacion" id="notificacion">
        <div class="notificacion-icono" id="notificacion-icono"></div>
        <div class="notificacion-contenido" id="notificacion-contenido"></div>
      </div>
    </main>

    <script type="module" src="./js/api.js"></script>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
